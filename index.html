a.output-cta{background:#c62828;color:#fff;border-color:#a91414;box-shadow:0 5px 14px rgba(198,40,40,.28);font-weight:800}a.output-cta:hover{background:#a91414;color:#fff;transform:translateY(-1px)}a.output-cta:focus-visible{outline:3px solid rgba(198,40,40,.35);outline-offset:3px}.progress-card{margin:18px 0 0;padding:14px 16px;border:1px solid #c9ddd0;border-radius:12px;background:#f7fbf8}.progress-meta{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}.progress-label{font-size:.78rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}.progress-value{font-weight:800;color:var(--ink)}.progress-track{height:9px;margin-top:10px;background:#dfeae3;border-radius:999px;overflow:hidden}.progress-fill{height:100%;width:0;background:#d9283a;border-radius:inherit;transition:width .25s ease}.progress-note{margin-top:7px;color:var(--muted);font-size:.85rem}</style></head><body><div class="shell"><header class="top" id="overview"><div class="eyebrow">Interactive Knowledge Map Â· Source-preserving</div><h1 id="project-title"></h1><p id="project-objective"></p><p class="question"><b>Strategic Question</b> Â· <span id="strategic-question"></span></p><section class="progress-card" aria-label="Tiáº¿n Ä‘á»™ dá»± Ã¡n"><div class="progress-meta"><span class="progress-label">Tiáº¿n Ä‘á»™ output</span><strong class="progress-value" id="progress-value"></strong></div><div class="progress-track" role="progressbar" aria-labelledby="progress-value" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progress-fill"></div></div><div class="progress-note" id="progress-note"></div></section><div class="toolbar"><input id="search" aria-label="TÃ¬m trong tÃ i liá»‡u" placeholder="TÃ¬m Phase, Step, ná»™i dungâ€¦"><button class="tool" id="expand">Expand all</button><button class="tool" id="collapse">Collapse all</button><button class="tool" id="clear">Clear filters</button><span class="results" id="results" aria-live="polite"></span></div></header><div class="layout"><aside class="sidebar" aria-label="Phase navigation"><div class="nav-label">Navigate</div><button class="phase-link active" data-target="overview">Overview <small>Project & flow</small></button><div id="nav"></div></aside><main class="main"><section class="flow" id="flow" aria-label="Project flow"></section><div id="content"></div></main></div></div><button class="back" id="back">â†‘ Overview</button><script>
const d=()=>window.KNOWLEDGE_MAP;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const m=d();const steps=m.phases.flatMap(p=>p.steps);const completed=steps.filter(s=>Boolean(s.outputUrl)).length;const total=steps.length;const percent=Math.round(completed/total*100);document.querySelector('#progress-value').textContent=completed+' / '+total+' b\u01b0\u1edbc \u0111\u00e3 c\u00f3 output \u00b7 '+percent+'%';document.querySelector('#progress-note').textContent='Ti\u1ebfn \u0111\u1ed9 t\u1ef1 c\u1eadp nh\u1eadt khi th\u00eam output m\u1edbi.';const fill=document.querySelector('#progress-fill');fill.style.width=percent+'%';fill.parentElement.setAttribute('aria-valuenow',percent);document.querySelector('#project-title').textContent=m.title;document.querySelector('#project-objective').textContent=m.objective;document.querySelector('#strategic-question').textContent=m.strategicQuestion;document.querySelector('#nav').innerHTML=m.phases.map(p=>`<button class="phase-link" data-target="${p.id}">${p.number}<small>${esc(p.title)} Â· ${p.steps.length} step${p.steps.length!==1?'s':''}</small></button>`).join('');document.querySelector('#flow').innerHTML=m.phases.map(p=>`<button data-target="${p.id}"><strong>${p.number}</strong><span>${esc(p.title)}</span><small>${p.steps.length} step${p.steps.length!==1?'s':''}</small></button>`).join('');document.querySelector('#content').innerHTML=m.phases.map(p=>`<section class="phase" id="${p.id}" data-search="${esc(p.number+' '+p.title+' '+p.objective)}"><header class="phase-head"><div><div class="phase-number">${p.number}</div><div class="phase-title">${esc(p.title)}</div><p class="phase-objective"><b>Objective</b> Â· ${esc(p.objective)}</p></div>${p.outputUrl?`<a class="phase-output-cta" href="${esc(p.outputUrl)}" target="_blank" rel="noopener">Click to view output ?</a>`:''}</header><div class="steps">${p.steps.map(s=>`<details class="step" data-search="${esc([s.number,s.title,s.objective||'',s.ambiguous||'',...s.blocks.flatMap(b=>Array.isArray(b[1])?[b[0],...b[1]]:[b[0],b[1]])].join(' '))}"><summary><span class="step-num">${esc(s.number||'â€”')}</span><span>${esc(s.title)}</span>${s.outputUrl?`<a class="output-cta" href="${esc(s.outputUrl)}" target="_blank" rel="noopener">Click to view output â†’</a>`:(s.number==='0.1'||s.number==='0.3')?'':`<span class="output-cta disabled" aria-disabled="true" title="ChÆ°a cÃ³ output Ä‘Æ°á»£c liÃªn káº¿t">Click to view output â€” chÆ°a tÃ­ch há»£p</span>`}</summary><div class="detail">${s.objective?`<div class="objective"><b>Objective</b><div>${esc(s.objective)}</div></div>`:''}${s.ambiguous?`<div class="ambiguity">${esc(s.ambiguous)}</div>`:''}${s.blocks.map(b=>`<div class="block"><h4>${esc(b[0])}</h4>${Array.isArray(b[1])?`<ul>${b[1].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<p>${esc(b[1])}</p>`}</div>`).join('')}</div></details>`).join('')}</div></section>`).join('');bind();}
function go(id){document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'});history.replaceState(null,'','#'+id);setActive(id)}function setActive(id){document.querySelectorAll('.phase-link').forEach(x=>x.classList.toggle('active',x.dataset.target===id))}function bind(){document.querySelectorAll('[data-target]').forEach(x=>x.addEventListener('click',()=>go(x.dataset.target)));}
function search(q){q=q.trim().toLowerCase();let count=0;document.querySelectorAll('.phase').forEach(p=>{let phaseHit=!q||p.dataset.search.toLowerCase().includes(q);let stepHit=false;p.querySelectorAll('.step').forEach(s=>{const hit=!q||s.dataset.search.toLowerCase().includes(q);s.classList.toggle('hidden',!hit);if(hit&&q){s.open=true;stepHit=true;highlight(s,q)}else clearMark(s)});const show=phaseHit||stepHit;p.classList.toggle('hidden',!show);if(show)count++});document.querySelector('#results').textContent=q?`${count} phase phÃ¹ há»£p`:''}
function clearMark(root){root.querySelectorAll('.mark').forEach(n=>n.replaceWith(n.textContent))}function highlight(root,q){clearMark(root);if(!q)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let nodes=[];while(w.nextNode())nodes.push(w.currentNode);nodes.forEach(n=>{const i=n.nodeValue.toLowerCase().indexOf(q);if(i>=0&&n.parentElement.tagName!=='SCRIPT'){const f=document.createDocumentFragment();f.append(n.nodeValue.slice(0,i),Object.assign(document.createElement('mark'),{className:'mark',textContent:n.nodeValue.slice(i,i+q.length)}),n.nodeValue.slice(i+q.length));n.replaceWith(f)}})}
render();document.querySelector('#search').addEventListener('input',e=>search(e.target.value));document.querySelector('#expand').onclick=()=>document.querySelectorAll('details').forEach(x=>x.open=true);document.querySelector('#collapse').onclick=()=>document.querySelectorAll('details').forEach(x=>x.open=false);document.querySelector('#clear').onclick=()=>{document.querySelector('#search').value='';search('');document.querySelectorAll('.step').forEach(clearMark)};document.querySelector('#back').onclick=()=>go('overview');const observer=new IntersectionObserver(entries=>{const e=entries.filter(x=>x.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(e)setActive(e.target.id)},{rootMargin:'-20% 0px -65% 0px',threshold:.05});document.querySelectorAll('.phase').forEach(x=>observer.observe(x));if(location.hash){setTimeout(()=>go(location.hash.slice(1)),120)}
</script></body></html>
