<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artera — Email Opt-in Knowledge Map</title><script>
/* Dashboard data. Labels appear only where supported by the supplied document. */
window.KNOWLEDGE_MAP = {
  title: 'Artera Website Email Opt-in Optimization Project',
  objective: 'Tăng tỷ lệ website visitors trở thành email subscribers và tăng giá trị doanh thu tạo ra trên mỗi subscriber mới, đồng thời duy trì premium brand experience và không gây ảnh hưởng tiêu cực đến purchase conversion.',
  strategicQuestion: 'Artera cần tối ưu những yếu tố nào trong hành trình email capture — đúng đối tượng, đúng điểm chạm, lời mời đăng ký, value/offer, messaging và form experience — để vừa tăng Website Email Opt-in Rate, vừa tăng Revenue per New Email Subscriber, mà không làm giảm premium brand experience hoặc cản trở conversion?',
  phases: [
    {id:'phase-0', number:'PHASE 0', title:'Define Objective & Measurement', objective:'Xác định thế nào được xem là thành công trước khi bắt đầu research, để toàn bộ optimization sau đó phục vụ đúng business objective.', steps:[
      {number:'0.1', title:'Xác định Primary Goals', blocks:[['Note','Sau khi lấy baseline mới chốt target cuối cùng:'],['Primary goals',['Tăng 30% Website Email Opt-in Rate so với baseline 30 ngày trước khi triển khai cải tiến.','Website Email Opt-in Rate = Số email subscribers mới từ website ÷ Tổng website sessions.','Tăng 10% Revenue per New Email Subscriber trong cửa sổ 30 ngày kể từ thời điểm subscriber đăng ký, so với baseline cohort.','Revenue per New Email Subscriber = Doanh thu từ các đơn hàng của subscriber mới trong 30 ngày đầu ÷ Số subscriber mới từ website.','Không làm giảm Checkout Conversion Rate so với baseline trong thời gian triển khai.']]]},
      {number:'0.3', title:'Xác định Supporting Metrics', ambiguous:'Source skips 0.2; retained exactly.', blocks:[['Supporting metrics',['Form view → submit rate.','Tỷ lệ sử dụng mã 10%.','Welcome-email click rate.','Unsubscribe và spam complaint.','AOV của đơn hàng dùng mã/đơn hàng từ subscriber mới.']]]}
    ]},
    {id:'phase-1',number:'PHASE 1',title:'Diagnose the Current Problem',objective:'Xác định khách truy cập đang rơi khỏi email-capture funnel ở đâu và vì sao, dựa trên dữ liệu định lượng, định tính, UX và hành vi người dùng.',steps:[
      {number:'1.1',outputUrl:'https://toolarterahome-byte.github.io/1.1-Quantitative-Analysis-WHAT-WHERE-/',title:'Quantitative Analysis — WHAT & WHERE?',objective:'Sử dụng dữ liệu định lượng để xác định điều gì đang xảy ra, xảy ra ở đâu, với nhóm visitor nào và mức độ lớn của vấn đề trong email-capture funnel.',blocks:[['A. Landing Page Analysis',['Trang nào nhận nhiều paid traffic nhất?','Trang nào có opt-in rate cao?','Trang nào có opt-in rate thấp?','Product page vs collection page vs homepage','Landing page nào tạo nhiều subscribers nhất?','Landing page nào tạo nhiều revenue nhất?']]]},
      {number:'1.2',title:'Qualitative Analysis — WHY?',objective:'Tìm hiểu tại sao visitor lại hành xử như vậy, bằng cách uncover motivations, needs, objections, concerns và reasons for/against subscribing.',blocks:[['A. Existing Customer / Subscriber Data',['Review customer reviews','Review comments/social conversations','Review post-purchase feedback','Review common objections','Review reasons customers hesitate']],['B. Identify Customer Motivations',['What customers want','What problem they are trying to solve','What outcome they want','What information they need','What inspires them','What makes them trust Artera']],['C. Identify Objections',['Price concerns','Quality concerns','Shipping','Returns','Product durability','Product sizing','Product suitability','Styling uncertainty','Brand credibility','“Why should I subscribe?”','“What will I actually receive?”']],['D. Identify Email-specific Friction',['Why would someone NOT give Artera their email?','Too much promotional content?','Don\'t want spam?','Don\'t want another brand in inbox?','Offer isn\'t attractive?','Value proposition unclear?','Don\'t understand what they\'ll receive?','Form appears too early?','Popup interrupts browsing?','They are already focused on product?','They don\'t trust the brand enough yet?']]]},
      {number:'1.3',title:'Heuristic / UX Audit',objective:'Đánh giá trải nghiệm email capture hiện tại để xác định friction, usability issues và experience problems có thể cản trở conversion hoặc làm giảm premium perception.',blocks:[['Review the actual opt-in experience',[]],['Entry',['When does opt-in appear?','Immediately?','After X seconds?','After scroll?','Exit intent?','Product interaction?','Multiple triggers?']],['Context',['Does the message relate to what the visitor is currently viewing?','Is the offer relevant to the visitor\'s intent?']],['Visual Hierarchy',['Is the value proposition immediately visible?','Is the headline dominant?','Is the benefit clear?','Is CTA visually clear?','Is the form visually overwhelming?']],['Mobile UX',['Can user understand the offer within 1–2 seconds?','Is CTA reachable with thumb?','Is close button easy to find?','Is keyboard behaviour clean?','Does popup cover important content?','Does it cause accidental clicks?','Does it feel intrusive?']],['Premium Brand Experience',['Does the popup look consistent with Artera?','Does it feel like a premium brand communication?','Does the discount dominate the experience?','Does urgency feel excessive?','Does the design feel “cheap” or overly promotional?','Does the opt-in interrupt rather than enhance the shopping experience?']]]},
      {number:'1.4',title:'Competitor Analysis',blocks:[['Process','Phân tích conversion strategy.'],['For each competitor',['Trigger','Timing','Placement','Audience/context','Headline','Supporting message','Value proposition','Incentive','CTA','Number of fields','Design','Mobile experience','Brand positioning','Post-signup experience']],['Sau đó categorize',['What is common?','What is differentiated?','What appears overused?','What value propositions are repeatedly used?','What opportunities are not being used?']]]}
    ]},
    {id:'phase-2',number:'PHASE 2',title:'Synthesize the Problem',objective:'Chuyển các dữ liệu và findings thành những vấn đề, customer insights và opportunity cụ thể, sau đó xác định vấn đề nào có tiềm năng tác động lớn nhất đến KPI.',steps:[
      {number:'2.1',title:'Build Problem Map',blocks:[['Tổng hợp evidence thành',['Traffic — Who is coming?','Intent — Why are they coming?','Behaviour — What are they doing?','Friction — Where are they stopping?','Motivation — What do they want?','Objection — What prevents action?','Value — What would make giving an email worthwhile?']]]},
      {number:'2.2',title:'Identify Opportunity Areas',blocks:[['Ví dụ',['Problem 1: Paid visitors are highly product-oriented but generic opt-in message doesn\'t connect with their shopping intent. → Opportunity: contextual relevance','Problem 2: Visitors don\'t clearly understand what happens after subscribing. → Opportunity: value proposition clarity','Problem 3: Discount attracts signup but may not attract high-value subscribers. → Opportunity: subscriber quality / value exchange','Problem 4: Mobile users encounter friction during form submission. → Opportunity: mobile UX']]]}
    ]},
    {id:'phase-3',number:'PHASE 3',title:'Define Value Exchange',objective:'Xác định giá trị đủ hấp dẫn để khách hàng sẵn sàng trao đổi email, đồng thời đảm bảo giá trị đó phù hợp với nhu cầu khách hàng, khả năng tạo revenue và premium positioning của Artera.',steps:[
      {number:'3.1',title:'Define Subscriber Value',blocks:[['Value candidates',['Discount (chính)','Exclusive access (free shipping cho đơn 180$ trở lên)','New product alerts','Styling inspiration','Home inspiration','Product education','Expert guidance','Early access']]]},
      {number:'3.2',title:'Evaluate Each Value Proposition',blocks:[['Dimension → Question',['Customer relevance → Khách có thực sự cần không?','Perceived value → Họ có thấy đáng để đổi email không?','Brand fit → Có phù hợp Artera không?','Revenue potential → Có khả năng tạo purchase không?','Subscriber quality → Có thu hút đúng customer không?','Premium fit → Có làm giảm perceived premium không?']],['Decision','=> Kết hợp 3.1 + 3.2 = Define Value Exchange'],['Cấu trúc',['Customer gives: Email','Artera gives: [specific value]','Customer expectation: [what happens next]']],['Ví dụ',['Give your email ↓ Get 10% off + styling inspiration ↓ Receive useful ideas + product stories + curated offers']]]}
    ]},
    {id:'phase-4',number:'PHASE 4',title:'Build Message Strategy',objective:'Xác định Artera cần nói gì và nói theo góc độ nào để truyền tải value proposition một cách relevant và thuyết phục, sau đó xây message bank để phục vụ testing.',steps:[
      {number:'4.1',title:'Create Message Territories',blocks:[['Ví dụ',['Territory A — Immediate Benefit (chính) - tìm cách lồng ghép với các Territory dưới: “Get 10% off your first order.”','Territory B — Inspiration: “Get ideas to make your space feel more like you.”','Territory C — Education: “Learn how to style your space with intention.”','Territory D — Exclusive Access: “Be first to discover what\'s next.”','Territory E — Product Discovery: “Find pieces worth bringing home.”']]]},
      {number:'4.2',title:'Build Message Bank',blocks:[['Mỗi message nên có',['Message Territory','Core Promise','Customer Benefit','Headline','Supporting Copy','CTA']]]},
      {number:'4.3',title:'Headline + CTA Pairing',blocks:[['Source note','Đúng như bạn vừa nói ở conversation trước: Headline + CTA nên được xem như một message unit. Không test headline riêng một cách vô nghĩa.'],['Ví dụ',['Make Your Space Feel More Like You / Get inspiration, styling tips & first access. / GET INSPIRED','vs.','A Little Something for Your First Order / Enjoy 10% off your first purchase. / GET 10% OFF','→ Mỗi variant đại diện cho một value proposition khác nhau.']]]}
    ]},
    {id:'phase-5',number:'PHASE 5',title:'Design Opt-in Experience',objective:'Thiết kế cách value proposition và message được đưa đến đúng người, đúng thời điểm và đúng ngữ cảnh, với trải nghiệm mobile-first, ít friction và phù hợp với premium brand experience.',steps:[
      {number:'5.1',title:'Audience',blocks:[['Audience',['New visitors','Paid traffic','Product viewers','Collection viewers','High-intent visitors','Cart visitors','Other relevant segments']]]},
      {number:'5.2',title:'Trigger',blocks:[['Trigger candidates',['Time-based','Scroll-based','Exit intent','Page interaction','Product interaction','Landing-page specific']]]},
      {number:'5.3',title:'Form',blocks:[['Form considerations',['Email only vs additional fields','CTA','Error handling','Success state','Confirmation','Mobile keyboard','Loading speed']]]},
      {number:'5.4',title:'Brand Experience',blocks:[['Brand experience considerations',['Typography','Imagery','Spacing','Tone of voice','Offer presentation','Discount prominence','Popup frequency','Frequency cap']]]}
    ]},
    {id:'phase-6',number:'PHASE 6',title:'Build Test Hypotheses',objective:'Chuyển các insights và opportunities thành những giả thuyết có thể kiểm chứng, xác định rõ thay đổi nào được kỳ vọng sẽ tác động đến KPI và vì sao.',steps:[
      {number:'',title:'Hypothesis Template',blocks:[['Template','Because [evidence/insight], we believe that [change], giữ yếu tố còn lại will cause [expected behaviour], because [reason].'],['Ví dụ','Because paid visitors arrive with strong product interest, we believe a product-relevant value proposition will increase opt-in rate compared with a generic newsletter message, because it provides a clearer reason to subscribe within the shopping context.']]}
    ]},
    {id:'phase-7',number:'PHASE 7',title:'Experimentation',objective:'Kiểm chứng các hypothesis bằng controlled experiments/A/B tests để xác định thay đổi nào thực sự tạo ra tác động tích cực đến opt-in và subscriber value.',steps:[
      {number:'',title:'Test Hierarchy & Checklist',ambiguous:'[Ambiguous in source] The test hierarchy moves from Level 2 to Level 4; no Level 3 is supplied.',blocks:[['Offer','Giữ nguyên 10% off cho đơn đầu tiên (forrm luôn thể hiện thông tin này)'],['Test hierarchy',['Level 1 — Value Proposition: 10% discount vs Inspiration vs Exclusive access','Level 2 — Message: Different message territories','Level 4 — UX: Trigger; Timing; Placement; Form friction','Level 5 — Creative: Headline; CTA; Image; Layout']],['Mỗi test cần checklist',['Hypothesis','Primary KPI','Secondary KPI','Guardrail KPI','Audience','Traffic source','Device','Control','Variant','Sample requirement','Test duration','Success criteria','Stop criteria','Brand-risk consideration']]]}
    ]},
    {id:'phase-8',number:'PHASE 8',title:'Analyze Results',objective:'Đánh giá tác động thực tế của từng experiment trên conversion, revenue, subscriber quality, email engagement và purchase experience.',steps:[
      {number:'',title:'Result Assessment',blocks:[['Conversion',['Opt-in rate thay đổi thế nào?']],['Subscriber quality',['Revenue per subscriber thay đổi thế nào?']],['Purchase',['Subscriber → purchase rate?','AOV?']],['Email quality',['Welcome click?','Unsubscribe?','Spam complaint?']],['Shopping experience',['Checkout conversion?','Bounce?','Engagement?']],['Quan trọng',['Có thể xảy ra: Variant A +30% opt-in nhưng −20% Revenue per Subscriber.','→ Không thể kết luận A tốt hơn chỉ vì opt-in rate cao hơn.','Đây chính là lý do bạn đặt Revenue per New Email Subscriber làm primary value KPI và Checkout Conversion Rate làm guardrail.']]]}
    ]},
    {id:'phase-9',number:'PHASE 9',title:'Learn & Iterate',objective:'Chuyển kết quả thử nghiệm thành customer/optimization learnings và hypothesis mới, tạo thành vòng lặp continuous optimization thay vì kết thúc sau một lần test.',steps:[
      {number:'',title:'Learning Loop',blocks:[['Key questions',['What happened?','Why might it have happened?','What did we learn about customers?','Which hypothesis was supported?','Which hypothesis was rejected?','What should we test next?','What should become the new control?']]]}
    ]}
  ]
};
</script><style>
:root{--ink:#1e2925;--muted:#67726d;--line:#dce3df;--paper:#fffefd;--wash:#f4f7f4;--accent:#486c58;--accentsoft:#e1ede4;--warm:#b87542;--warning:#8b5a2b;--radius:16px;--shadow:0 12px 34px rgba(32,58,45,.08)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--wash);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}.shell{max-width:1440px;margin:auto;padding:24px}.top{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:var(--shadow)}.eyebrow,.tag{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;font-weight:750;color:var(--accent)}h1{font-size:clamp(1.7rem,4vw,3rem);line-height:1.1;max-width:950px;margin:.5rem 0 1rem}h2{font-size:1.28rem;margin:0}p{margin:.45rem 0}.question{border-left:3px solid var(--warm);padding:5px 0 5px 14px;color:#495550;max-width:1000px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px}.tool,.phase-link,button{font:inherit;border:1px solid var(--line);background:white;color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer}.tool:hover,button:hover,.phase-link:hover{border-color:var(--accent);background:var(--accentsoft)}#search{min-width:230px;flex:1;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font:inherit}.layout{display:grid;grid-template-columns:250px 1fr;gap:24px;margin-top:24px}.sidebar{position:sticky;top:18px;height:max-content;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px}.nav-label{font-size:.75rem;color:var(--muted);font-weight:700;margin:6px 9px 9px}.phase-link{display:block;width:100%;text-align:left;border:0;margin:2px 0;padding:9px}.phase-link small{display:block;color:var(--muted);font-size:.74rem}.phase-link.active{background:var(--accent);color:white}.phase-link.active small{color:#d9ebe0}.main{min-width:0}.flow{display:grid;grid-template-columns:repeat(5,minmax(145px,1fr));gap:10px;margin-bottom:24px}.flow button{min-height:105px;text-align:left;padding:14px;box-shadow:0 3px 12px rgba(20,40,30,.04)}.flow strong{display:block;font-size:.76rem;color:var(--accent);letter-spacing:.05em}.flow span{font-weight:700;line-height:1.2;display:block;margin:7px 0}.flow small{display:block;color:var(--muted)}.phase{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);margin:0 0 18px;overflow:hidden;scroll-margin-top:16px}.phase-head{display:grid;grid-template-columns:1fr auto;gap:12px;padding:22px 22px 16px;border-bottom:1px solid var(--line)}.phase-number{font-size:.76rem;font-weight:800;color:var(--accent);letter-spacing:.08em}.phase-title{font-size:1.35rem;font-weight:800;line-height:1.2;margin:4px 0}.phase-objective{color:#45514b;max-width:850px}.steps{padding:14px}.step{border:1px solid var(--line);border-radius:12px;margin:9px 0;overflow:hidden}.step summary{padding:14px 16px;cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center;font-weight:750}.step summary::-webkit-details-marker{display:none}.step summary:after{content:'+';margin-left:auto;font-size:1.25rem;color:var(--accent)}.step[open] summary{background:#f7faf7;border-bottom:1px solid var(--line)}.step[open] summary:after{content:'−'}.step-num{color:var(--accent);font-size:.8rem;min-width:32px}.phase-output-cta{align-self:center;font-size:.82rem;font-weight:750;color:var(--accent);text-decoration:none;padding:9px 12px;border:1px solid var(--accent);border-radius:9px;white-space:nowrap}.phase-output-cta.disabled{color:#8b9690;border-color:#d7ded9;background:#f4f6f4;cursor:not-allowed}.output-cta{margin-left:auto;font-size:.76rem;font-weight:700;color:var(--accent);text-decoration:none;padding:6px 9px;border:1px solid var(--accent);border-radius:8px;white-space:nowrap}.output-cta:hover{background:var(--accentsoft)}.output-cta.disabled{color:#8b9690;border-color:#d7ded9;background:#f4f6f4;cursor:not-allowed}.detail{padding:16px 18px 20px}.objective{background:var(--accentsoft);border-radius:10px;padding:12px 14px;margin:0 0 13px}.objective b,.block h4{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin:0 0 6px}.block{padding:12px 0;border-top:1px solid #edf0ee}.block:first-of-type{border-top:0}.block ul{margin:7px 0 0;padding:0;list-style:none}.block li{padding:4px 0 4px 23px;position:relative}.block li:before{content:'□';position:absolute;left:0;color:var(--accent);font-size:1.05em}.block p{white-space:pre-wrap}.ambiguity{border:1px solid #e7c99e;background:#fff9f0;color:var(--warning);border-radius:9px;padding:10px 12px;font-size:.9rem;margin:0 0 12px}.results{margin:0 0 18px;color:var(--muted);font-size:.93rem}.hidden{display:none!important}.mark{background:#ffec94;border-radius:2px;padding:0 1px}.back{display:none;position:fixed;right:20px;bottom:20px;border:0;background:var(--accent);color:white;box-shadow:var(--shadow)}.empty{padding:36px;text-align:center;color:var(--muted)}@media(max-width:1000px){.layout{grid-template-columns:1fr}.sidebar{position:relative;top:auto;display:flex;overflow:auto;gap:4px}.nav-label{display:none}.phase-link{min-width:160px}.flow{grid-template-columns:repeat(3,minmax(130px,1fr))}}@media(max-width:600px){.shell{padding:12px}.top{padding:22px}.flow{grid-template-columns:repeat(2,minmax(0,1fr))}.flow button{min-height:90px}.phase-head{padding:17px}.toolbar{align-items:stretch}.toolbar>*{min-height:42px}.sidebar{padding:8px}.phase-link{min-width:143px}.step summary{padding:13px}.detail{padding:14px}.back{display:block}}
a.output-cta{background:#c62828;color:#fff;border-color:#a91414;box-shadow:0 5px 14px rgba(198,40,40,.28);font-weight:800}a.output-cta:hover{background:#a91414;color:#fff;transform:translateY(-1px)}a.output-cta:focus-visible{outline:3px solid rgba(198,40,40,.35);outline-offset:3px}</style></head><body><div class="shell"><header class="top" id="overview"><div class="eyebrow">Interactive Knowledge Map · Source-preserving</div><h1 id="project-title"></h1><p id="project-objective"></p><p class="question"><b>Strategic Question</b> · <span id="strategic-question"></span></p><div class="toolbar"><input id="search" aria-label="Tìm trong tài liệu" placeholder="Tìm Phase, Step, nội dung…"><button class="tool" id="expand">Expand all</button><button class="tool" id="collapse">Collapse all</button><button class="tool" id="clear">Clear filters</button><span class="results" id="results" aria-live="polite"></span></div></header><div class="layout"><aside class="sidebar" aria-label="Phase navigation"><div class="nav-label">Navigate</div><button class="phase-link active" data-target="overview">Overview <small>Project & flow</small></button><div id="nav"></div></aside><main class="main"><section class="flow" id="flow" aria-label="Project flow"></section><div id="content"></div></main></div></div><button class="back" id="back">↑ Overview</button><script>
const d=()=>window.KNOWLEDGE_MAP;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const m=d();document.querySelector('#project-title').textContent=m.title;document.querySelector('#project-objective').textContent=m.objective;document.querySelector('#strategic-question').textContent=m.strategicQuestion;document.querySelector('#nav').innerHTML=m.phases.map(p=>`<button class="phase-link" data-target="${p.id}">${p.number}<small>${esc(p.title)} · ${p.steps.length} step${p.steps.length!==1?'s':''}</small></button>`).join('');document.querySelector('#flow').innerHTML=m.phases.map(p=>`<button data-target="${p.id}"><strong>${p.number}</strong><span>${esc(p.title)}</span><small>${p.steps.length} step${p.steps.length!==1?'s':''}</small></button>`).join('');document.querySelector('#content').innerHTML=m.phases.map(p=>`<section class="phase" id="${p.id}" data-search="${esc(p.number+' '+p.title+' '+p.objective)}"><header class="phase-head"><div><div class="phase-number">${p.number}</div><div class="phase-title">${esc(p.title)}</div><p class="phase-objective"><b>Objective</b> · ${esc(p.objective)}</p></div>${p.outputUrl?`<a class="phase-output-cta" href="${esc(p.outputUrl)}" target="_blank" rel="noopener">Click to view output →</a>`:`<span class="phase-output-cta disabled" aria-disabled="true" title="Chưa có output được liên kết">View output — chưa tích hợp</span>`}</header><div class="steps">${p.steps.map(s=>`<details class="step" data-search="${esc([s.number,s.title,s.objective||'',s.ambiguous||'',...s.blocks.flatMap(b=>Array.isArray(b[1])?[b[0],...b[1]]:[b[0],b[1]])].join(' '))}"><summary><span class="step-num">${esc(s.number||'—')}</span><span>${esc(s.title)}</span>${s.outputUrl?`<a class="output-cta" href="${esc(s.outputUrl)}" target="_blank" rel="noopener">Click to view output →</a>`:`<span class="output-cta disabled" aria-disabled="true" title="Chưa có output được liên kết">Click to view output — chưa tích hợp</span>`}</summary><div class="detail">${s.objective?`<div class="objective"><b>Objective</b><div>${esc(s.objective)}</div></div>`:''}${s.ambiguous?`<div class="ambiguity">${esc(s.ambiguous)}</div>`:''}${s.blocks.map(b=>`<div class="block"><h4>${esc(b[0])}</h4>${Array.isArray(b[1])?`<ul>${b[1].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<p>${esc(b[1])}</p>`}</div>`).join('')}</div></details>`).join('')}</div></section>`).join('');bind();}
function go(id){document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'});history.replaceState(null,'','#'+id);setActive(id)}function setActive(id){document.querySelectorAll('.phase-link').forEach(x=>x.classList.toggle('active',x.dataset.target===id))}function bind(){document.querySelectorAll('[data-target]').forEach(x=>x.addEventListener('click',()=>go(x.dataset.target)));}
function search(q){q=q.trim().toLowerCase();let count=0;document.querySelectorAll('.phase').forEach(p=>{let phaseHit=!q||p.dataset.search.toLowerCase().includes(q);let stepHit=false;p.querySelectorAll('.step').forEach(s=>{const hit=!q||s.dataset.search.toLowerCase().includes(q);s.classList.toggle('hidden',!hit);if(hit&&q){s.open=true;stepHit=true;highlight(s,q)}else clearMark(s)});const show=phaseHit||stepHit;p.classList.toggle('hidden',!show);if(show)count++});document.querySelector('#results').textContent=q?`${count} phase phù hợp`:''}
function clearMark(root){root.querySelectorAll('.mark').forEach(n=>n.replaceWith(n.textContent))}function highlight(root,q){clearMark(root);if(!q)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let nodes=[];while(w.nextNode())nodes.push(w.currentNode);nodes.forEach(n=>{const i=n.nodeValue.toLowerCase().indexOf(q);if(i>=0&&n.parentElement.tagName!=='SCRIPT'){const f=document.createDocumentFragment();f.append(n.nodeValue.slice(0,i),Object.assign(document.createElement('mark'),{className:'mark',textContent:n.nodeValue.slice(i,i+q.length)}),n.nodeValue.slice(i+q.length));n.replaceWith(f)}})}
render();document.querySelector('#search').addEventListener('input',e=>search(e.target.value));document.querySelector('#expand').onclick=()=>document.querySelectorAll('details').forEach(x=>x.open=true);document.querySelector('#collapse').onclick=()=>document.querySelectorAll('details').forEach(x=>x.open=false);document.querySelector('#clear').onclick=()=>{document.querySelector('#search').value='';search('');document.querySelectorAll('.step').forEach(clearMark)};document.querySelector('#back').onclick=()=>go('overview');const observer=new IntersectionObserver(entries=>{const e=entries.filter(x=>x.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(e)setActive(e.target.id)},{rootMargin:'-20% 0px -65% 0px',threshold:.05});document.querySelectorAll('.phase').forEach(x=>observer.observe(x));if(location.hash){setTimeout(()=>go(location.hash.slice(1)),120)}
</script></body></html>
