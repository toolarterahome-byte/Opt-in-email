<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artera — Email Opt-in Knowledge Map</title><script>
/* Dashboard data. Labels appear only where supported by the supplied document. */
window.KNOWLEDGE_MAP = {
  title: 'Artera Website Email Opt-in Optimization Project',
  objective: 'Tăng tỷ lệ website visitors trở thành email subscribers và tăng giá trị doanh thu tạo ra trên mỗi subscriber mới, đồng thời duy trì premium brand experience và không gây ảnh hưởng tiêu cực đến purchase conversion.',
  strategicQuestion: 'Artera cần tối ưu những yếu tố nào trong hành trình email capture — đúng đối tượng, đúng điểm chạm, lời mời đăng ký, value/offer, messaging và form experience — để vừa tăng Website Email Opt-in Rate, vừa tăng Revenue per New Email Subscriber, mà không làm giảm premium brand experience hoặc cản trở conversion?',
  phases: [
    {id:'phase-0', number:'PHASE 0', title:'Define Objective & Measurement', objective:'Xác định thế nào được xem là thành công trước khi bắt đầu research, để toàn bộ optimization sau đó phục vụ đúng business objective.', steps:[
      {number:'0.1', title:'Xác định Primary Goals', blocks:[['Note','Sau khi lấy baseline mới chốt target cuối cùng:'],['Primary goals',['Tăng 30% Website Email Opt-in Rate so với baseline 30 ngày trước khi triển khai cải tiến.','Website Email Opt-in Rate = Số email subscribers mới từ website ÷ Tổng website sessions.','Tăng 10% Revenue per New Email Subscriber trong cửa sổ 30 ngày kể từ thời điểm subscriber đăng ký, so với baseline cohort.','Revenue per New Email Subscriber = Doanh thu từ các đơn hàng của subscriber mới trong 30 ngày đầu ÷ Số subscriber mới từ website.','Không làm giảm Checkout Conversion Rate so với baseline trong thời gian triển khai.']]]},
      {number:'0.3', title:'Xác định Supporting Metrics', ambiguous:'Source skips 0.2; retained exactly.', blocks:[['Supporting metrics',['Form view → submit rate.','Tỷ lệ sử dụng mã 10%.','Welcome-email click rate.','Unsubscribe và spam complaint.','AOV của đơn hàng dùng mã/đơn hàng từ subscriber mới.']]]}
    ]},
    {id:'phase-1',number:'PHASE 1',title:'Diagnose the Current Problem',objective:'Xác định khách truy cập đang rơi khỏi email-capture funnel ở đâu và vì sao, dựa trên dữ liệu định lượng, định tính, UX và hành vi người dùng.',steps:[
      {number:'1.1',outputUrl:'https://toolarterahome-byte.github.io/1.1-Quantitative-Analysis-WHAT-WHERE-/',title:'Quantitative Analysis — WHAT & WHERE?',objective:'Sử dụng dữ liệu định lượng để xác định điều gì đang xảy ra, xảy ra ở đâu, với nhóm visitor nào và mức độ lớn của vấn đề trong email-capture funnel.',blocks:[['A. Landing Page Analysis',['Trang nào nhận nhiều paid traffic nhất?','Trang nào có opt-in rate cao?','Trang nào có opt-in rate thấp?','Product page vs collection page vs homepage','Landing page nào tạo nhiều subscribers nhất?','Landing page nào tạo nhiều revenue nhất?']]]},
      {number:'1.2',outputUrl:'https://toolarterahome-byte.github.io/1.2-Qualitative-Analysis-WHY-v3/',title:'Qualitative Analysis — WHY?',objective:'Tìm hiểu tại sao visitor lại hành xử như vậy, bằng cách uncover motivations, needs, objections, concerns và reasons for/against subscribing.',blocks:[['A. Existing Customer / Subscriber Data',['Review customer reviews','Review comments/social conversations','Review post-purchase feedback','Review common objections','Review reasons customers hesitate']],['B. Identify Customer Motivations',['What customers want','What problem they are trying to solve','What outcome they want','What information they need','What inspires them','What makes them trust Artera']],['C. Identify Objections',['Price concerns','Quality concerns','Shipping','Returns','Product durability','Product sizing','Product suitability','Styling uncertainty','Brand credibility','“Why should I subscribe?”','“What will I actually receive?”']],['D. Identify Email-specific Friction',['Why would someone NOT give Artera their email?','Too much promotional content?','Don\'t want spam?','Don\'t want another brand in inbox?','Offer isn\'t attractive?','Value proposition unclear?','Don\'t understand what they\'ll receive?','Form appears too early?','Popup interrupts browsing?','They are already focused on product?','They don\'t trust the brand enough yet?']]]},
      {number:'1.3',outputUrl:'https://toolarterahome-byte.github.io/1.3-Heuristic-UX-Audit-Email-Capture/',title:'Heuristic / UX Audit',objective:'Đánh giá trải nghiệm email capture hiện tại để xác định friction, usability issues và experience problems có thể cản trở conversion hoặc làm giảm premium perception.',blocks:[['Review the actual opt-in experience',[]],['Entry',['When does opt-in appear?','Immediately?','After X seconds?','After scroll?','Exit intent?','Product interaction?','Multiple triggers?']],['Context',['Does the message relate to what the visitor is currently viewing?','Is the offer relevant to the visitor\'s intent?']],['Visual Hierarchy',['Is the value proposition immediately visible?','Is the headline dominant?','Is the benefit clear?','Is CTA visually clear?','Is the form visually overwhelming?']],['Mobile UX',['Can user understand the offer within 1–2 seconds?','Is CTA reachable with thumb?','Is close button easy to find?','Is keyboard behaviour clean?','Does popup cover important content?','Does it cause accidental clicks?','Does it feel intrusive?']],['Premium Brand Experience',['Does the popup look consistent with Artera?','Does it feel like a premium brand communication?','Does the discount dominate the experience?','Does urgency feel excessive?','Does the design feel “cheap” or overly promotional?','Does the opt-in interrupt rather than enhance the shopping experience?']]]},
      {number:'1.4',outputUrl:'https://toolarterahome-byte.github.io/1.4-Competitor-Analysis-Optin/',title:'Competitor Analysis',blocks:[['Process','Phân tích conversion strategy.'],['For each competitor',['Trigger','Timing','Placement','Audience/context','Headline','Supporting message','Value proposition','Incentive','CTA','Number of fields','Design','Mobile experience','Brand positioning','Post-signup experience']],['Sau đó categorize',['What is common?','What is differentiated?','What appears overused?','What value propositions are repeatedly used?','What opportunities are not being used?']]]}
    ]},
    {id:'phase-2',number:'PHASE 2',title:'Synthesize the Problem',objective:'Chuyển các dữ liệu và findings thành những vấn đề, customer insights và opportunity cụ thể, sau đó xác định vấn đề nào có tiềm năng tác động lớn nhất đến KPI.',steps:[
      {number:'2.1',outputUrl:'https://toolarterahome-byte.github.io/2.1-Problem-Map-Optin/',title:'Build Problem Map',blocks:[['Tổng hợp evidence thành',['Traffic — Who is coming?','Intent — Why are they coming?','Behaviour — What are they doing?','Friction — Where are they stopping?','Motivation — What do they want?','Objection — What prevents action?','Value — What would make giving an email worthwhile?']]]},
      {number:'2.2',outputUrl:'https://toolarterahome-byte.github.io/2.2-Opportunity-Areas-Optin/',title:'Identify Opportunity Areas',blocks:[['Ví dụ',['Problem 1: Paid visitors are highly product-oriented but generic opt-in message doesn\'t connect with their shopping intent. → Opportunity: contextual relevance','Problem 2: Visitors don\'t clearly understand what happens after subscribing. → Opportunity: value proposition clarity','Problem 3: Discount attracts signup but may not attract high-value subscribers. → Opportunity: subscriber quality / value exchange','Problem 4: Mobile users encounter friction during form submission. → Opportunity: mobile UX']]]}
    ]},
    {id:'phase-3',number:'PHASE 3',title:'Build Message Strategy',objective:'X\u00e1c \u0111\u1ecbnh Artera c\u1ea7n n\u00f3i g\u00ec v\u00e0 n\u00f3i theo g\u00f3c \u0111\u1ed9 n\u00e0o \u0111\u1ec3 truy\u1ec1n t\u1ea3i value proposition m\u1ed9t c\u00e1ch relevant v\u00e0 thuy\u1ebft ph\u1ee5c, sau \u0111\u00f3 x\u00e2y message bank \u0111\u1ec3 ph\u1ee5c v\u1ee5 testing.',steps:[
{number:'3.1',outputUrl:'https://toolarterahome-byte.github.io/3.1-Message-Directions-Optin/',title:'Evaluate Value Proposition',objective:'X\u00e1c \u0111\u1ecbnh nh\u1eefng h\u01b0\u1edbng communication Artera c\u00f3 th\u1ec3 s\u1eed d\u1ee5ng \u0111\u1ec3 truy\u1ec1n t\u1ea3i value exchange, d\u1ef1a tr\u00ean customer insight, competitor patterns, brand/business objectives v\u00e0 c\u00e1c evidence li\u00ean quan.',blocks:[['Evaluate Value Proposition',['Review customer insights & opportunities t\u1eeb Phase 2','Review competitor messaging: H\u1ecd \u0111ang communicate value g\u00ec? H\u1ecd d\u00f9ng nh\u1eefng message angles n\u00e0o? Nh\u1eefng angle n\u00e0o ph\u1ed5 bi\u1ebfn? Nh\u1eefng angle n\u00e0o kh\u00e1c bi\u1ec7t? C\u00f3 direction n\u00e0o Artera ch\u01b0a khai th\u00e1c?','Review Qualitative Analysis','X\u00e1c \u0111\u1ecbnh c\u00e1c message directions (th\u1ec3 hi\u1ec7n \u1edf headline line) - core offer: 10% off first order + free shipping $150+','\u0110\u00e1nh gi\u00e1 t\u1eebng direction: Customer relevance; Evidence strength; Business relevance; Brand fit; Differentiation opportunity','Ch\u1ecdn c\u00e1c directions s\u1ebd \u0111\u01b0a v\u00e0o Message Bank']]]},
{number:'3.2',outputUrl:'https://toolarterahome-byte.github.io/3.1-Optin-Architecture-Artera/',title:'Define Opt-in Architecture',objective:'D\u1ef1a tr\u00ean c\u1ea5u tr\u00fac opt-in c\u1ee7a competitors + direction x\u00e1c \u0111\u1ecbnh form Artera n\u00ean g\u1ed3m nh\u1eefng component n\u00e0o v\u00e0 flow ra sao.',blocks:[['Define Opt-in Architecture',['Ph\u00e2n t\u00edch c\u1ea5u tr\u00fac opt-in c\u1ee7a competitors','X\u00e1c \u0111\u1ecbnh common components & patterns','Ph\u00e2n t\u00edch th\u1ee9 t\u1ef1 / flow gi\u1eefa c\u00e1c components','X\u00e1c \u0111\u1ecbnh c\u1ea5u tr\u00fac ph\u00f9 h\u1ee3p v\u1edbi Artera','\u0110\u1ec1 xu\u1ea5t final opt-in architecture']]]},
{number:'3.3',outputUrl:'https://toolarterahome-byte.github.io/3.3-Message-Bank-Optin/',title:'Build Message Bank',blocks:[['Build Message Bank',['Build message cho t\u1eebng component \u0111\u00e3 \u0111\u01b0\u1ee3c x\u00e1c \u0111\u1ecbnh trong architecture: opt-in form v\u00e0 post-submit form','Gi\u1eef consistency v\u1edbi core offer: 10% off first order + free shipping on $150+','\u0110i\u1ec1u ch\u1ec9nh message theo context c\u1ee7a t\u1eebng form']]]}
]},
    {id:'phase-4',number:'PHASE 4',title:'Build Test Hypotheses',objective:'Chuyển các insights và opportunities thành những giả thuyết có thể kiểm chứng, xác định rõ thay đổi nào được kỳ vọng sẽ tác động đến KPI và vì sao.',steps:[
      {number:'4.1',title:'Hypothesis Template',blocks:[['Template','Because [evidence/insight], we believe that [change], giữ yếu tố còn lại will cause [expected behaviour], because [reason].'],['Ví dụ','Because paid visitors arrive with strong product interest, we believe a product-relevant value proposition will increase opt-in rate compared with a generic newsletter message, because it provides a clearer reason to subscribe within the shopping context.']]}
    ]},
    {id:'phase-5',number:'PHASE 5',title:'Experimentation',objective:'Kiểm chứng các hypothesis bằng controlled experiments/A/B tests để xác định thay đổi nào thực sự tạo ra tác động tích cực đến opt-in và subscriber value.',steps:[
      {number:'5.1',title:'Test Hierarchy & Checklist',ambiguous:'[Ambiguous in source] The test hierarchy moves from Level 2 to Level 4; no Level 3 is supplied.',blocks:[['Offer','Giữ nguyên 10% off cho đơn đầu tiên (forrm luôn thể hiện thông tin này)'],['Test hierarchy',['Level 1 — Value Proposition: 10% discount vs Inspiration vs Exclusive access','Level 2 — Message: Different message territories','Level 4 — UX: Trigger; Timing; Placement; Form friction','Level 5 — Creative: Headline; CTA; Image; Layout']],['Mỗi test cần checklist',['Hypothesis','Primary KPI','Secondary KPI','Guardrail KPI','Audience','Traffic source','Device','Control','Variant','Sample requirement','Test duration','Success criteria','Stop criteria','Brand-risk consideration']]]}
    ]},
    {id:'phase-6',number:'PHASE 6',title:'Analyze Results',objective:'Đánh giá tác động thực tế của từng experiment trên conversion, revenue, subscriber quality, email engagement và purchase experience.',steps:[
      {number:'6.1',title:'Result Assessment',blocks:[['Conversion',['Opt-in rate thay đổi thế nào?']],['Subscriber quality',['Revenue per subscriber thay đổi thế nào?']],['Purchase',['Subscriber → purchase rate?','AOV?']],['Email quality',['Welcome click?','Unsubscribe?','Spam complaint?']],['Shopping experience',['Checkout conversion?','Bounce?','Engagement?']],['Quan trọng',['Có thể xảy ra: Variant A +30% opt-in nhưng −20% Revenue per Subscriber.','→ Không thể kết luận A tốt hơn chỉ vì opt-in rate cao hơn.','Đây chính là lý do bạn đặt Revenue per New Email Subscriber làm primary value KPI và Checkout Conversion Rate làm guardrail.']]]}
    ]},
    {id:'phase-7',number:'PHASE 7',title:'Learn & Iterate',objective:'Chuyển kết quả thử nghiệm thành customer/optimization learnings và hypothesis mới, tạo thành vòng lặp continuous optimization thay vì kết thúc sau một lần test.',steps:[
      {number:'7.1',title:'Learning Loop',blocks:[['Key questions',['What happened?','Why might it have happened?','What did we learn about customers?','Which hypothesis was supported?','Which hypothesis was rejected?','What should we test next?','What should become the new control?']]]}
    ]}
  ]
};
</script><style>

olite"></span></div></header><div class="layout"><aside class="sidebar" aria-label="Phase navigation"><div class="nav-label">Navigate</div><button class="phase-link active" data-target="overview">Overview <small>Project & flow</small></button><div id="nav"></div></aside><main class="main"><section class="flow" id="flow" aria-label="Project flow"></section><div id="content"></div></main></div></div><button class="back" id="back">↑ Overview</button><script>
const d=()=>window.KNOWLEDGE_MAP;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const m=d();const steps=m.phases.flatMap(p=>p.steps);const completed=steps.filter(s=>Boolean(s.outputUrl)).length;const total=steps.length;const percent=Math.round(completed/total*100);document.querySelector('#progress-value').textContent=completed+' / '+total+' b\u01b0\u1edbc \u0111\u00e3 c\u00f3 output \u00b7 '+percent+'%';document.querySelector('#progress-note').textContent='Ti\u1ebfn \u0111\u1ed9 t\u1ef1 c\u1eadp nh\u1eadt khi th\u00eam output m\u1edbi.';const fill=document.querySelector('#progress-fill');fill.style.width=percent+'%';fill.parentElement.setAttribute('aria-valuenow',percent);document.querySelector('#project-title').textContent=m.title;document.querySelector('#project-objective').textContent=m.objective;document.querySelector('#strategic-question').textContent=m.strategicQuestion;document.querySelector('#nav').innerHTML=m.phases.map(p=>`<button class="phase-link" data-target="${p.id}">${p.number}<small>${esc(p.title)} · ${p.steps.length} step${p.steps.length!==1?'s':''}</small></button>`).join('');document.querySelector('#flow').innerHTML=m.phases.map(p=>`<button data-target="${p.id}"><strong>${p.number}</strong><span>${esc(p.title)}</span><small>${p.steps.length} step${p.steps.length!==1?'s':''}</small></button>`).join('');document.querySelector('#content').innerHTML=m.phases.map(p=>`<section class="phase" id="${p.id}" data-search="${esc(p.number+' '+p.title+' '+p.objective)}"><header class="phase-head"><div><div class="phase-number">${p.number}</div><div class="phase-title">${esc(p.title)}</div><p class="phase-objective"><b>Objective</b> · ${esc(p.objective)}</p></div>${p.outputUrl?`<a class="phase-output-cta" href="${esc(p.outputUrl)}" target="_blank" rel="noopener">Click to view output ?</a>`:''}</header><div class="steps">${p.steps.map(s=>`<details class="step" data-search="${esc([s.number,s.title,s.objective||'',s.ambiguous||'',...s.blocks.flatMap(b=>Array.isArray(b[1])?[b[0],...b[1]]:[b[0],b[1]])].join(' '))}"><summary><span class="step-num">${esc(s.number||'—')}</span><span>${esc(s.title)}</span>${s.outputUrl?`<a class="output-cta" href="${esc(s.outputUrl)}" target="_blank" rel="noopener">Click to view output →</a>`:(s.number==='0.1'||s.number==='0.3')?'':`<span class="output-cta disabled" aria-disabled="true" title="Chưa có output được liên kết">Click to view output — chưa tích hợp</span>`}</summary><div class="detail">${s.objective?`<div class="objective"><b>Objective</b><div>${esc(s.objective)}</div></div>`:''}${s.ambiguous?`<div class="ambiguity">${esc(s.ambiguous)}</div>`:''}${s.blocks.map(b=>`<div class="block"><h4>${esc(b[0])}</h4>${Array.isArray(b[1])?`<ul>${b[1].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<p>${esc(b[1])}</p>`}</div>`).join('')}</div></details>`).join('')}</div></section>`).join('');bind();}
function go(id){document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'});history.replaceState(null,'','#'+id);setActive(id)}function setActive(id){document.querySelectorAll('.phase-link').forEach(x=>x.classList.toggle('active',x.dataset.target===id))}function bind(){document.querySelectorAll('[data-target]').forEach(x=>x.addEventListener('click',()=>go(x.dataset.target)));}
function search(q){q=q.trim().toLowerCase();let count=0;document.querySelectorAll('.phase').forEach(p=>{let phaseHit=!q||p.dataset.search.toLowerCase().includes(q);let stepHit=false;p.querySelectorAll('.step').forEach(s=>{const hit=!q||s.dataset.search.toLowerCase().includes(q);s.classList.toggle('hidden',!hit);if(hit&&q){s.open=true;stepHit=true;highlight(s,q)}else clearMark(s)});const show=phaseHit||stepHit;p.classList.toggle('hidden',!show);if(show)count++});document.querySelector('#results').textContent=q?`${count} phase phù hợp`:''}
function clearMark(root){root.querySelectorAll('.mark').forEach(n=>n.replaceWith(n.textContent))}function highlight(root,q){clearMark(root);if(!q)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let nodes=[];while(w.nextNode())nodes.push(w.currentNode);nodes.forEach(n=>{const i=n.nodeValue.toLowerCase().indexOf(q);if(i>=0&&n.parentElement.tagName!=='SCRIPT'){const f=document.createDocumentFragment();f.append(n.nodeValue.slice(0,i),Object.assign(document.createElement('mark'),{className:'mark',textContent:n.nodeValue.slice(i,i+q.length)}),n.nodeValue.slice(i+q.length));n.replaceWith(f)}})}
render();document.querySelector('#search').addEventListener('input',e=>search(e.target.value));document.querySelector('#expand').onclick=()=>document.querySelectorAll('details').forEach(x=>x.open=true);document.querySelector('#collapse').onclick=()=>document.querySelectorAll('details').forEach(x=>x.open=false);document.querySelector('#clear').onclick=()=>{document.querySelector('#search').value='';search('');document.querySelectorAll('.step').forEach(clearMark)};document.querySelector('#back').onclick=()=>go('overview');const observer=new IntersectionObserver(entries=>{const e=entries.filter(x=>x.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(e)setActive(e.target.id)},{rootMargin:'-20% 0px -65% 0px',threshold:.05});document.querySelectorAll('.phase').forEach(x=>observer.observe(x));if(location.hash){setTimeout(()=>go(location.hash.slice(1)),120)}
</script></body></html>
